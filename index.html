<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>こだわりラーメンレシピ集</title>
    <style>
        body {
            font-family: "Hiragino Sans", "Meiryo", sans-serif;
            background-color: #fcf8f5;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #d32f2f, #ff7043);
            color: white;
            padding: 40px 20px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        /* 検索フォーム */
        .search-box {
            text-align: center;
            margin: 0 auto 40px auto;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }
        .search-box input {
            flex-grow: 1;
            padding: 14px 18px;
            border: 3px solid #ff7043;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: #d32f2f;
            box-shadow: 0 4px 12px rgba(211,47,47,0.15);
        }
        .search-box button {
            background: linear-gradient(135deg, #d32f2f, #ff7043);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(211,47,47,0.2);
            transition: 0.2s;
        }
        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(211,47,47,0.3);
        }
        /* カテゴリーボタン（6大スープ直行） */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }
        .category-card {
            background: white;
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            border: 2px solid #ffebd6;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .category-card .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        /* SVGアイコンのサイズ制御とホバー時のなめらかなアニメーション */
        .category-card svg {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .category-card:hover svg {
            transform: scale(1.1) rotate(3deg); /* ホバー時に少し大きく、小粋に傾く演出 */
        }
        .category-card:hover {
            transform: translateY(-6px);
            border-color: #ff7043;
            box-shadow: 0 12px 25px rgba(255,112,67,0.15);
            background: #fffbf9;
        }
        @media (max-width: 768px) {
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .category-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>🍜 極旨ラーメン レシピブログ</header>

    <div class="container">
        <!-- 検索フォーム -->
        <form action="search.html" method="get" class="search-box">
            <input type="text" name="q" placeholder="レシピ名や具材（豚骨、チャーシュー、にんにく等）で検索..." required>
            <button type="submit">検索</button>
        </form>
