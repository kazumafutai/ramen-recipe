<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>こだわりラーメンレシピ集</title>
<style>
body {
  font-family: "Hiragino Sans", "Meiryo", sans-serif;
  background-color: #fcf8f5;
  color: #333;
  margin: 0;
  padding: 0;
}

/* ★名店の佇まいを感じさせるプレミアムヘッダーCSS（暖簾なし・完全差し戻し版） */
.premium-header {
  position: relative;
  /* 漆黒から極暗赤色（醤油・スープの深み）へと沈む高級なグラデーション */
  background: linear-gradient(135deg, #140502 0%, #300c05 50%, #140502 100%);
  padding: 65px 20px;
  text-align: center;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  /* どんぶりの縁の朱塗りをイメージしたアンダーライン */
  border-bottom: 4px solid #ff7043;
}

/* ★テクスチャ効果：CSSだけで「上質な和紙」のようなかすれた質感を演出し、デジタルチープさを完全排除 */
.premium-header::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    radial-gradient(rgba(255, 112, 67, 0.12) 1px, transparent 0),
    radial-gradient(rgba(255, 112, 67, 0.08) 1px, transparent 0);
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
  opacity: 0.4;
  z-index: 1;
}

/* ★アニメーション：スープの「湯気」や「熱気」を想起させる、光の揺らぎエフェクトを裏側に仕込む */
.premium-header::after {
  content: "";
  position: absolute;
  top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,112,67,0.06) 0%, transparent 60%);
  z-index: 2;
  animation: waveSteam 12s infinite alternate ease-in-out;
}

@keyframes waveSteam {
  0% { transform: translate(-5%, -5%) rotate(0deg); }
  100% { transform: translate(5%, 5%) rotate(10deg); }
}

.header-container {
  position: relative;
  z-index: 3; /* 背景エフェクトの上に、文字をくっきりと最前面に立たせる */
  max-width: 800px;
  margin: 0 auto;
}

/* ★再現専門バッジ：黒金のラベル */
.brand-badge {
  display: inline-block;
  background: #ff7043;
  color: #140502;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  padding: 5px 15px;
  border-radius: 4px;
  letter-spacing: 3px;
  margin-bottom: 18px;
  box-shadow: 0 4px 12px rgba(255, 112, 67, 0.25);
}

/* ★メインタイトル：3重の立体影 */
.header-main {
  font-size: 40px;
  font-weight: 900;
  color: #ffffff;
  margin: 0 0 10px 0;
  letter-spacing: 3px;
  text-shadow: 
    0 2px 4px rgba(0,0,0,0.9),
    0 0 15px rgba(255, 112, 67, 0.4),
    0 0 30px rgba(255, 112, 67, 0.2);
}

/* ★和モダンデコレーター */
.header-decorator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin-bottom: 22px;
}
.header-decorator .line {
  display: inline-block;
  height: 2px;
  width: 50px;
  background: linear-gradient(90deg, transparent, #ff7043);
}
.header-decorator .line:last-child {
  background: linear-gradient(90deg, #ff7043, transparent);
}
.header-decorator .icon {
  font-size: 22px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
}

/* ★サブコピー：純白ではなく、スープの湯気に馴染むほんのり温かい「杏仁ホワイト」を採用 */
.header-sub {
  font-size: 17px;
  font-weight: 500;
  color: #ffe2d1;
  line-height: 1.6;
  margin: 0;
  letter-spacing: 1.5px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.7);
}

/* スマホ表示への配慮 */
@media (max-width: 768px) {
  .premium-header {
    padding: 50px 15px;
  }
  .header-main {
    font-size: 28px;
    letter-spacing: 1px;
  }
  .header-decorator {
    margin-bottom: 15px;
  }
  .header-decorator .line {
    width: 30px;
  }
  .header-sub {
    font-size: 13.5px;
    letter-spacing: 0.5px;
    padding: 0 10px;
    line-height: 1.5;
  }
}

.container {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
}

/* 検索フォーム */
.search-box {
  text-align: center;
  margin: 0 auto 40px auto;
  max-width: 600px;
  display: flex;
  gap: 10px;
}
.search-box input {
  flex-grow: 1;
  padding: 14px 18px;
  border: 3px solid #ff7043;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: 0.2s;
}
.search-box input:focus {
  border-color: #d32f2f;
  box-shadow: 0 4px 12px rgba(211,47,47,0.15);
}
.search-box button {
  background: linear-gradient(135deg, #d32f2f, #ff7043);
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(211,47,47,0.2);
  transition: 0.2s;
}
.search-box button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(211,47,47,0.3);
}

/* ★自信作レシピ（ヒーロー特集エリア）の極上デザイン */
.featured-recipe-card {
  display: grid;
  grid-template-columns: 1.2fr 1fr; /* PCでは左にデカ写真、右にテキストの黄金比率 */
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  border: 2px solid #ffe2d1;
  margin-bottom: 45px;
  transition: transform 0.3s, box-shadow 0.3s;
}

.featured-recipe-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 35px rgba(255,112,67,0.12);
}

/* 左側：写真エリア */
.featured-img-wrapper {
  position: relative;
  overflow: hidden;
  height: 320px; /* PCでの写真の高さ */
}

.featured-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
}

.featured-recipe-card:hover .featured-img {
  transform: scale(1.08); /* ホバー時にフワッと拡大 */
}

/* 「おすすめ！」の極上リボンラベル */
.featured-badge {
  position: absolute;
  top: 15px;
  left: 15px;
  background: linear-gradient(135deg, #ff7043, #d32f2f);
  color: white;
  padding: 6px 14px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  z-index: 2;
}

/* 右側：テキスト解説エリア */
.featured-content {
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.featured-tag {
  color: #ff7043;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

.featured-title {
  font-size: 26px;
  font-weight: bold;
  color: #2c1a16;
  line-height: 1.3;
  margin: 0 0 12px 0;
}

.featured-desc {
  font-size: 15px;
  color: #66524e;
  line-height: 1.6;
  margin: 0 0 22px 0;
}

/* 読者を惹きつける、グラデーションがかかった誘導ボタン */
.featured-btn {
  display: inline-block;
  align-self: flex-start; /* ボタンが横いっぱいに広がらないようにする */
  background: linear-gradient(135deg, #d32f2f, #ff7043);
  color: white;
  text-decoration: none;
  padding: 12px 28px;
  border-radius: 30px;
  font-weight: bold;
  font-size: 15px;
  box-shadow: 0 4px 15px rgba(211,47,47,0.25);
  transition: 0.2s;
}

.featured-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(211,47,47,0.4);
}

/* ★完璧なレスポンシブ（スマホ表示）のための微調整 */
@media (max-width: 768px) {
  .featured-recipe-card {
    grid-template-columns: 1fr; /* スマホでは縦並びに強制変更 */
    margin-bottom: 35px;
  }
  .featured-img-wrapper {
    height: 220px; /* スマホ用に写真を少し薄くして画面を圧迫しないように */
  }
  .featured-content {
    padding: 20px;
  }
  .featured-title {
    font-size: 20px;
  }
  .featured-desc {
    font-size: 14px;
    margin-bottom: 15px;
  }
  .featured-btn {
    width: 100%; /* スマホでは押しやすいようにボタンを横いっぱいに広げる */
    text-align: center;
    box-sizing: border-box;
  }
}

/* カテゴリーボタン（6大スープ直行） */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}
.category-card {
  background: white;
  border-radius: 16px;
  padding: 35px 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  color: #d32f2f;
  text-decoration: none;
  box-shadow: 0 6px 15px rgba(0,0,0,0.05);
  border: 2px solid #ffebd6;
  transition: 0.3s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.category-card .icon {
  font-size: 50px;
  margin-bottom: 15px;
}
.category-card:hover {
  transform: translateY(-6px);
  border-color: #ff7043;
  box-shadow: 0 12px 25px rgba(255,112,67,0.15);
  background: #fffbf9;
}

/* ★レスポンシブ表示（スマホ対応）の強化 */
@media (max-width: 768px) {
  .category-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .header-main {
    font-size: 28px; /* スマホ画面でタイトルがはみ出さないサイズに調整 */
  }
  .header-sub {
    font-size: 13px; /* コンセプトコピーをスマホの1行（または2行）に美しく収める */
    padding: 6px 12px;
    line-height: 1.4;
  }
}
@media (max-width: 480px) {
  .category-grid {
    grid-template-columns: 1fr;
  }
}

/* ★背景画像付きカテゴリカードの極上お洒落エフェクト（文字下部固定版） */
.category-card.has-bg {
  position: relative;
  overflow: hidden;
  background-color: #1a0d0a; /* 暗めの土台を敷く */
  border: 2px solid #ff7043;
  border-radius: 16px;
  
  /* カードの高さを固定して、綺麗な比率のギャラリー風にします */
  height: 200px; 
  box-sizing: border-box;
  
  /* ★文字を確実に下部に配置するためのFlex制御 */
  display: flex;
  flex-direction: column;
  justify-content: flex-end; /* 子要素（文字）を下端に寄せる */
  align-items: center;
  padding: 0 15px 20px 15px; /* 下部に適度な余白（20px）を空けて美しく配置 */
  text-decoration: none;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
}

/* 背景写真の初期状態（文字を読みやすくするため通常時は30%の薄さで透かす） */
.category-card.has-bg::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: var(--bg-img);
  background-size: cover;
  background-position: center;
  opacity: 0.35; 
  filter: grayscale(10%) brightness(85%); 
  transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s, filter 0.4s;
  z-index: 1;
}

/* ★ホバーした瞬間に写真が鮮明に浮かび上がりズームインする演出 */
.category-card.has-bg:hover {
  transform: translateY(-8px);
  border-color: #ff7043;
  box-shadow: 0 15px 30px rgba(211, 47, 47, 0.25);
}

.category-card.has-bg:hover::before {
  opacity: 0.8; /* マウスを載せたら写真が80%までクッキリ浮かび上がる */
  filter: grayscale(0%) brightness(95%); 
  transform: scale(1.12); /* 写真が奥からフワッと12%大きく迫ってくる */
}

/* ★下部に沈めた文字のスタイリング（どんな写真が来ても絶対に読める設計） */
.category-card.has-bg .category-title {
  position: relative;
  z-index: 2; /* 写真の上に重ねる */
  color: #ffffff; /* 文字は白 */
  font-size: 22px; /* カードに馴染む絶妙な文字サイズ */
  font-weight: bold;
  letter-spacing: 1px;
  width: 100%;
  text-align: center;
  
  /* 文字の後ろにグラデーションの影を薄く敷くことで、白いスープの写真と重なっても文字が絶対にボヤけないようにする防衛策 */
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.5); 
}
</style>
</head>
<body>

<header class="premium-header">
  <div class="header-container">
    <!-- サイトの覚悟を示すプレミアムバッジ -->
    <div class="brand-badge">究極の家ラーメン再現専門</div>
    
    <h1 class="header-main">極旨ラーメン レシピブログ</h1>
    
    <!-- タイトルの威厳を引き締める和モダンな装飾線 -->
    <div class="header-decorator">
      <span class="line"></span>
      <span class="icon">🍜</span>
      <span class="line"></span>
    </div>
    
    <p class="header-sub">【スーパーの食材だけ】ブレンダーと裏技で、あの名店の味を自宅で完全再現！</p>
  </div>
</header>

<div class="container">
  <!-- 検索フォーム -->
  <form action="search.html" method="get" class="search-box">
    <input type="text" name="q" placeholder="レシピ名や具材（豚骨、チャーシュー、にんにく等）で検索..." required>
    <button type="submit">検索</button>
  </form>

  <!-- ★【新設】店主の渾身作・キラーレシピ特集エリア -->
  <div class="featured-recipe-card">
    <div class="featured-img-wrapper">
      <span class="featured-badge">店主のイチオシ！</span>
      <img src="recipes/img/tenichi.jpg" alt="天下一品再現ラーメン" class="featured-img" onerror="this.src='recipes/img/toripaitan.jpg';">
    </div>
    <div class="featured-content">
      <span class="featured-tag">★ 奇跡の再現レシピ</span>
      <h2 class="featured-title">家でここまでできる！？スーパーの食材だけで「天下一品風こってりラーメン」を完全再現する裏技</h2>
      <p class="featured-desc">特別な骨などは一切使いません。スーパーで買える「ある食材」とブレンダーを駆使して、あの超濃厚なドロドロ極旨スープを自宅で再現する魔法のレシピです。</p>
      <a href="recipes/tenichi.html" class="featured-btn">このレシピを今すぐ作る →</a>
    </div>
  </div>

  <!-- 6大スープ直行ボタン -->
  <div class="category-grid">
    <a href="buta/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/tonkotsu.jpg');">
      <span>豚ベース</span>
    </a>
    <!-- 鶏ベース（お洒落背景画像バージョン） -->
    <a href="tori/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/tori.jpg');">
      <span>鶏ベース</span>
    </a>
    <a href="gyokai/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/gyokai.jpg');">
      <span>魚介ベース</span>
    </a>
    <a href="shoyu/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/shoyu.jpg');">
      <span>醤油ベース</span>
    </a>
    <a href="miso/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/miso.jpg');">
      <span>味噌ベース</span>
    </a>
    <a href="shio/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/shio.jpg');">
      <span>塩ベース</span>
    </a>
    <a href="jiro/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/jiro.jpg');">
      <span>二郎系ラーメン</span>
    </a>
    <a href="tsukemen/index.html" class="category-card has-bg" style="--bg-img: url('recipes/img/tsukemen.jpg');">
      <span>つけ麺</span>
    </a>
  </div>
</div>

</body>
</html>
