<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ラーメンレシピ検索結果 | 極旨ラーメン レシピブログ</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg-main: #fbf9f6;
  --bg-card: #ffffff;
  --text-primary: #1c1412;
  --text-secondary: #5e524d;
  --text-muted: #8c7e77;
  --color-primary: #c53030;
  --color-primary-dark: #9b1c1c;
  --color-accent: #d97706;
  --color-border: #eee7e0;
  --shadow-sm: 0 2px 8px rgba(28, 20, 18, 0.04);
  --shadow-md: 0 8px 24px rgba(28, 20, 18, 0.07);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; }
body {
  font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  margin: 0;
  padding: 0;
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

/* ヘッダー */
.site-header {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 12px 20px;
}
.header-inner {
  max-width: 960px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.site-logo {
  font-family: 'Shippori Mincho', serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--text-primary);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.site-logo span {
  background: var(--color-primary);
  color: #fff;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Zen Kaku Gothic New', sans-serif;
}
.nav-back-link {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--bg-main);
  border: 1px solid var(--color-border);
  transition: all 0.2s ease;
}
.nav-back-link:hover {
  background: var(--color-primary);
  color: #fff;
}

.search-hero {
  background: linear-gradient(135deg, #140806 0%, #2b0e07 50%, #140806 100%);
  color: #fff;
  text-align: center;
  padding: 40px 20px;
  border-bottom: 3px solid var(--color-primary);
}
.search-hero h1 {
  font-family: 'Shippori Mincho', serif;
  font-size: 28px;
  font-weight: 800;
  margin: 0 0 15px 0;
}

.container {
  max-width: 960px;
  margin: 35px auto 80px auto;
  padding: 0 20px;
}

/* 検索バー */
.search-input-wrap {
  display: flex;
  max-width: 600px;
  margin: 0 auto 35px auto;
  background: #fff;
  border: 2px solid var(--color-border);
  border-radius: 30px;
  padding: 4px 6px 4px 18px;
  box-shadow: var(--shadow-sm);
}
.search-input-wrap:focus-within {
  border-color: var(--color-primary);
}
.search-input {
  flex-grow: 1;
  border: none;
  background: transparent;
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
.search-btn {
  background: var(--color-primary);
  color: #fff;
  border: none;
  font-size: 13px;
  font-weight: 800;
  padding: 8px 20px;
  border-radius: 20px;
  cursor: pointer;
}

.search-status-bar {
  font-family: 'Shippori Mincho', serif;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 25px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--text-primary);
}

.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.menu-item-modern {
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
}
.menu-item-modern:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.menu-img-link {
  height: 180px;
  overflow: hidden;
  display: block;
}
.menu-img-link img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.menu-item-modern:hover .menu-img-link img {
  transform: scale(1.06);
}
.menu-info {
  padding: 16px;
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.menu-name-link {
  font-family: 'Shippori Mincho', serif;
  font-size: 16px;
  font-weight: 800;
  color: var(--text-primary);
  text-decoration: none;
  line-height: 1.45;
  margin-bottom: 8px;
}
.menu-name-link:hover { color: var(--color-primary); }
.menu-ing-tags {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
  margin-bottom: 12px;
}
.menu-read-more {
  font-size: 13px;
  font-weight: 800;
  color: var(--color-primary);
  text-decoration: none;
}

.no-result-card {
  background: #fff;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: 50px 20px;
  text-align: center;
  color: var(--text-muted);
}

.site-footer {
  background: #140b09;
  color: #d1c5c0;
  text-align: center;
  padding: 40px 20px;
  font-size: 13px;
  border-top: 4px solid var(--color-primary);
}
.site-footer a { color: var(--color-accent); text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="site-logo">
      <span>極旨</span> ラーメンレシピブログ
    </a>
    <a href="index.html" class="nav-back-link">← トップへ戻る</a>
  </div>
</header>

<div class="search-hero">
  <h1>ラーメンレシピ検索</h1>
</div>

<main class="container">
  <form action="search.html" method="get" class="search-input-wrap">
    <input type="text" name="q" id="search-box-input" class="search-input" placeholder="具材名やスープ名で再検索..." required>
    <button type="submit" class="search-btn">検索</button>
  </form>

  <div class="search-status-bar" id="search-summary">検索中...</div>
  <div class="result-grid" id="result-grid"></div>
</main>

<footer class="site-footer">
  <p style="margin: 0 0 12px 0;">
    <a href="about.html">運営者情報・プライバシーポリシー・お問い合わせ</a>
  </p>
  <p style="margin: 0; color: #8c7e77; font-size: 12px;">
    &copy; 極旨ラーメン レシピブログ All Rights Reserved.
  </p>
</footer>

<script src="search_data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const query = params.get('q') ? params.get('q').trim() : "";

  const summaryEl = document.getElementById("search-summary");
  const gridEl = document.getElementById("result-grid");
  const inputEl = document.getElementById("search-box-input");

  if (query) {
      inputEl.value = query;
      summaryEl.textContent = `「${query}」の検索結果`;

      const results = recipeSearchData.filter(recipe => {
          return recipe.name.toLowerCase().includes(query.toLowerCase()) || 
                 recipe.ingredients.toLowerCase().includes(query.toLowerCase());
      });

      if (results.length === 0) {
          summaryEl.textContent = `「${query}」に一致するレシピはありませんでした`;
          gridEl.innerHTML = `
            <div class="no-result-card" style="grid-column: 1/-1;">
              <p style="font-size: 16px; margin: 0 0 10px 0;">該当するラーメンレシピが見つかりませんでした。</p>
              <p style="font-size: 13px; margin: 0;">別のキーワード（例：豚骨、鶏、ブレンダー、にんにく等）でお試しください。</p>
            </div>
          `;
      } else {
          summaryEl.textContent = `「${query}」の検索結果（${results.length}件）`;
          results.forEach(recipe => {
              const card = document.createElement("div");
              card.className = "menu-item-modern";
              card.innerHTML = `
                  <a href="${recipe.link}" class="menu-img-link">
                      <img src="${recipe.image}" alt="${recipe.name}" onerror="this.src='recipes/img/tonkotsu.jpg';">
                  </a>
                  <div class="menu-info">
                      <div>
                        <a href="${recipe.link}" class="menu-name-link">${recipe.name}</a>
                        <div class="menu-ing-tags">🛒 ${recipe.ingredients.substring(0, 45)}...</div>
                      </div>
                      <a href="${recipe.link}" class="menu-read-more">レシピを見る →</a>
                  </div>
              `;
              gridEl.appendChild(card);
          });
      }
  } else {
      summaryEl.textContent = "検索キーワードを入力してください";
  }
</script>

</body>
</html>
