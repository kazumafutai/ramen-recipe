<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>鶏ガラなしでも大丈夫！「鶏白湯ラーメン」</title>
<!-- ★SEO＆SNS拡散用メタタグ -->
<meta name="description" content="">
<meta property="og:title" content="鶏ガラなしでも大丈夫！「鶏白湯ラーメン」">
<meta property="og:description" content="">
<meta property="og:image" content="img/toripaitan.jpg">
<meta property="og:type" content="article">

<style>
body {
  font-family: "Hiragino Sans", "Meiryo", sans-serif;
  margin: 0;
  background: #fcf8f5;
  line-height: 1.8;
  color: #333;
}

/* ★トップページと統一した、漆黒和モダンのプレミアムヘッダー */
header {
  position: relative;
  background: linear-gradient(135deg, #140502 0%, #300c05 50%, #140502 100%);
  padding: 40px 20px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  border-bottom: 4px solid #ff7043;
}
header::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    radial-gradient(rgba(255, 112, 67, 0.12) 1px, transparent 0),
    radial-gradient(rgba(255, 112, 67, 0.08) 1px, transparent 0);
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
  opacity: 0.4;
  z-index: 1;
}

.header-title {
  position: relative;
  z-index: 3;
  color: #ffffff;
  font-size: 28px;
  font-weight: 900;
  margin: 0 0 15px 0;
  letter-spacing: 2px;
  text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(255, 112, 67, 0.4);
}

.back-link {
  position: relative;
  z-index: 3;
  display: inline-block;
  color: #ffe2d1;
  text-decoration: none;
  font-size: 14px;
  border: 1px solid rgba(255, 112, 67, 0.5);
  padding: 8px 20px;
  border-radius: 30px;
  background: rgba(0,0,0,0.3);
  transition: 0.2s;
}

.back-link:hover {
  background: rgba(255, 112, 67, 0.3);
  color: white;
}

.container {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

/* ★AI生成の極上写真を大迫力で見せる写真カード */
.photo-card {
  background: white;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
  margin-bottom: 40px;
  border: 2px solid #ffe2d1;
}

.photo-card img {
  width: 100%;
  height: 450px; /* シズル感を爆発させるために高さを大幅に拡大 */
  object-fit: cover;
}

.photo-card .caption {
  padding: 20px;
  font-size: 16px;
  font-weight: bold;
  color: #5d4037;
  text-align: center;
  background: #fffbf9;
}

/* レシピカード全体 */
.recipe-card {
  background: white;
  padding: 35px;
  border-radius: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.05);
  margin-bottom: 40px;
}

.recipe-card h2 {
  margin-top: 0;
  border-left: 6px solid #ff7043;
  padding-left: 15px;
  font-size: 24px;
  color: #2c1a16;
}

/* 材料ブロック */
.ingredients-wrapper {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 20px;
  margin-bottom: 40px;
}

.ingredients-block {
  background: #fffaf7;
  padding: 20px;
  border-radius: 12px;
  border: 1px solid #ffe2d1;
  flex: 1;
  min-width: 250px;
}

.ingredients-title {
  font-weight: bold;
  font-size: 18px;
  margin-bottom: 15px;
  color: #d32f2f;
  border-bottom: 2px solid #ff7043;
  padding-bottom: 8px;
}

.ingredients-block ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

/* ★追加のプロ技：材料リストの右端にボタンをピシッと整列させる */
.ingredients-block li {
  padding: 12px 0;
  border-bottom: 1px dashed #ffcca8;
  display: flex;
  justify-content: space-between; /* 両端に引き離す */
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.ingredients-block li span:first-child {
  font-weight: bold;
  color: #2c1a16;
  flex-grow: 1; /* 材料名を左端に固定 */
}

.ingredients-block li .amount {
  color: #d32f2f;
  font-weight: bold;
  margin-left: auto; /* 確実に右端へピシッと整列させる指定 */
  text-align: right;
  white-space: nowrap;
}

/* 材料名と購入ボタンを縦にズラさず、綺麗に横並びにするインラインフレックス設定 */
.ingredients-block li span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 8px; /* 材料名とアフィリエイトボタンの間の程よい距離 */
}

/* ★進化した、視線を強制的にハックする「魔力のアフィリエイトボタン」 */
.shop-link {
  display: inline-block;
  background: linear-gradient(135deg, #ff9900 0%, #ff5d00 100%); /* より燃えるような鮮やかなグラデーションに変更 */
  color: white !important;
  text-decoration: none;
  font-size: 11px;
  font-weight: 900; /* 文字をさらに極太に */
  padding: 6px 14px;
  border-radius: 4px;
  box-shadow: 0 4px 10px rgba(255, 93, 0, 0.35);
  transition: all 0.3s ease;
  white-space: nowrap;
  position: relative;
  overflow: hidden; /* 光のエフェクトをボタン内に収めるために必須 */
  
  /* ★仕掛け①：2秒に1回、フワッと拍動して読者に存在を主張し続ける */
  animation: pulseButton 2s infinite ease-in-out;
}

/* ★天才的アイデア：アフィリエイト付きの材料名の極上装飾 */
/* ★決定版：詳細度の競合をねじ伏せ、100%確実にオレンジにするための指定 */
.ingredients-wrapper .ingredients-block li span a.ing-link,
.ingredients-block li span a.ing-link,
.ing-link {
  color: #ff5d00 !important; /* ボタンと同じ、購買欲をそそるブランドオレンジ */
  text-decoration: underline !important; /* リンクであることを直感的に伝える上品な下線 */
  font-weight: bold !important;
  transition: color 0.2s ease;
}

/* ホバー（タップ）した際に、お肉のような上品な深赤にフワッと変化 */
.ingredients-wrapper .ingredients-block li span a.ing-link:hover,
.ingredients-block li span a.ing-link:hover,
.ing-link:hover {
  color: #d32f2f !important;
  text-decoration: none !important; /* ホバー時は下線を消して動きを演出 */
}

/* ★仕掛け②：ボタンの表面を「斜めの光のライン」が3.5秒ごとにキラリと走り抜ける（シズル感演出） */
.shop-link::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -70%;
  width: 30%;
  height: 200%;
  background: linear-gradient(
    90deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,0.6) 50%,
    rgba(255,255,255,0) 100% /* ★ 100__ から「100%」に完全修正！ */
  );
  transform: rotate(25deg);
  animation: shine 3.5s infinite ease-in-out;
}

/* ホバー時の挙動をよりリッチに */
.shop-link:hover {
  transform: translateY(-3px) scale(1.05); /* 触るとフワッと浮き上がって拡大 */
  box-shadow: 0 8px 20px rgba(255, 93, 0, 0.5);
  background: linear-gradient(135deg, #ffa834 0%, #ff7700 100%);
}

/* 拍動アニメーションの定義 */
@keyframes pulseButton {
  0% {
    transform: scale(1);
    box-shadow: 0 4px 10px rgba(255, 93, 0, 0.35);
  }
  50% {
    transform: scale(1.04); /* わずかに膨らむ */
    box-shadow: 0 6px 18px rgba(255, 93, 0, 0.6); /* 影がジュワッと広がる */
  }
  100% {
    transform: scale(1);
    box-shadow: 0 4px 10px rgba(255, 93, 0, 0.35);
  }
}

/* 光るエフェクトアニメーションの定義 */
@keyframes shine {
  0% { left: -70%; }
  15% { left: 120%; } /* 一瞬でボタンを通り抜ける */
  100% { left: 120%; } /* しばらく待機 */
}

/* 作り方ステップ */
.step {
  background: #fff;
  padding: 18px 20px;
  border-radius: 10px;
  margin-bottom: 15px;
  border-left: 5px solid #ff7043;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  border: 1px solid #f5f5f5;
  border-left-width: 5px;
  line-height: 1.7;
}

@media (max-width: 768px) {
  .photo-card img { height: 280px; }
  .header-title { font-size: 22px; }
  .recipe-card { padding: 20px; }
}
</style>
</head>
<body>

<header>
  <h1 class="header-title">鶏ガラなしでも大丈夫！「鶏白湯ラーメン」</h1>
  <a class="back-link" href="../index.html">← トップページへ戻る</a>
</header>

<div class="container">
  <!-- 写真カード -->
  <div class="photo-card">
    <img src="img/toripaitan.jpg" alt="鶏ガラなしでも大丈夫！「鶏白湯ラーメン」">
    <div class="caption">鶏ガラがなし、濃厚鶏白湯</div>
  </div>

  <!-- レシピカード -->
  <div class="recipe-card">
    <h2>材料（1人前）</h2>
    <div class="ingredients-wrapper">
      <div class="ingredients-block"><div class="ingredients-title">材料</div><ul><li><span>鶏もも肉</span><span class="amount">１２０g</span></li><li><span>昆布だしの素</span><span class="amount">小さじ１</span></li></ul></div>
    </div>

    <h2>作り方</h2>
    <div id="steps">
      <div class="step">1. 鶏もも肉を３㎝角に切る。</div><div class="step">2. 鍋に水７５０mlと切った鶏もも肉を入れ、沸騰するまで強火で沸かす。</div><div class="step">3. 沸騰したら弱火にして、蓋をし１時間煮る。</div>
    </div>

    <div id="addon">
      
        <div class="remarks-card" style="margin-top: 35px; background: #fffde6; border-left: 6px solid #fbc02d; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); text-align: left;">
            <h3 style="margin: 0 0 10px 0; font-size: 18px; color: #f57f17; display: flex; align-items: center; gap: 6px;">💡 ちょい足しメモ・備考</h3>
            <p style="margin: 0; font-size: 15px; color: #5d4037; line-height: 1.6; white-space: pre-wrap;">昆布だしを入れるのがポイント</p>
        </div>
    </div>
  </div>
</div>

</body>
</html>
